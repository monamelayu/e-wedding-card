<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RSVP Dashboard · Nuqman &amp; Alya</title>
  <meta name="robots" content="noindex, nofollow" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Jost:wght@300;400;500&display=swap" rel="stylesheet" />
  <style>
    :root {
      --surface-1: #ffffff;
      --page: #f6f9fd;
      --text-primary: #2e3a4f;
      --text-secondary: #55647f;
      --muted: #74839c;
      --grid: #e1eaf6;
      --baseline: #c9d8ec;
      --border: rgba(47, 77, 143, 0.14);
      --series-1: #4a6fb5;   /* attending */
      --royal-deep: #2f4d8f;
      --gold: #c8a464;
      --decline: #74839c;    /* declined = neutral, de-emphasised */
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --surface-1: #1a2440;
        --page: #0f1526;
        --text-primary: #e8eef8;
        --text-secondary: #b8c6dd;
        --muted: #8296b5;
        --grid: #263352;
        --baseline: #33436b;
        --border: rgba(255, 255, 255, 0.12);
        --series-1: #8fabd9;
        --royal-deep: #a8c2e8;
      }
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: "Jost", system-ui, -apple-system, "Segoe UI", sans-serif;
      font-weight: 300;
      background: var(--page);
      color: var(--text-primary);
      padding: 24px 16px 60px;
      line-height: 1.5;
    }
    .wrap { max-width: 760px; margin: 0 auto; }
    header { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 20px; }
    h1 { font-family: "Cormorant Garamond", Georgia, serif; font-size: 1.55rem; font-weight: 600; color: var(--royal-deep); }
    h1 small { display: block; font-family: "Jost", sans-serif; font-size: 0.8rem; font-weight: 400; color: var(--text-secondary); }
    .refresh-row { display: flex; align-items: center; gap: 10px; }
    #last-updated { font-size: 0.75rem; color: var(--muted); }
    button.refresh {
      font: inherit; font-size: 0.8rem; padding: 6px 14px; border-radius: 999px;
      border: 1px solid var(--series-1); background: var(--surface-1); color: var(--series-1); cursor: pointer;
    }
    button.refresh:hover { border-color: var(--royal-deep); color: var(--royal-deep); }

    .filters { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 20px; }
    .chip {
      font: inherit; font-size: 0.78rem; letter-spacing: 0.04em; padding: 6px 14px;
      border-radius: 999px; border: 1px solid var(--series-1);
      background: var(--surface-1); color: var(--series-1); cursor: pointer;
    }
    .chip:hover { border-color: var(--royal-deep); }
    .chip.active { background: var(--series-1); color: #fff; }

    .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin-bottom: 20px; }
    .tile {
      background: var(--surface-1); border: 1px solid var(--border); border-radius: 12px; padding: 14px 16px;
    }
    .tile .label { font-size: 0.75rem; color: var(--text-secondary); }
    .tile .value { font-size: 1.7rem; font-weight: 600; line-height: 1.2; }
    .tile .sub { font-size: 0.72rem; color: var(--muted); }

    .card {
      background: var(--surface-1); border: 1px solid var(--border); border-radius: 12px;
      padding: 18px 18px 14px; margin-bottom: 20px;
    }
    .card h2 { font-family: "Cormorant Garamond", Georgia, serif; font-size: 1.15rem; font-weight: 600; color: var(--royal-deep); margin-bottom: 2px; }
    .card .subtitle { font-size: 0.75rem; color: var(--text-secondary); margin-bottom: 14px; }

    .bar-row { display: grid; grid-template-columns: 150px 1fr 90px; align-items: center; gap: 10px; padding: 7px 0; }
    .bar-row .g-label { font-size: 0.8rem; color: var(--text-secondary); text-align: right; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .bar-track { position: relative; height: 18px; border-left: 1px solid var(--baseline); }
    .bar {
      position: absolute; left: 0; top: 0; bottom: 0;
      background: var(--series-1); border-radius: 0 4px 4px 0;
      min-width: 2px; transition: width 0.4s ease; cursor: default;
    }
    .bar-row { cursor: pointer; }
    .bar-row:hover .bar { filter: brightness(1.12); }
    .bar-row.dim { opacity: 0.35; }
    .bar-val { font-size: 0.8rem; font-variant-numeric: tabular-nums; }
    .bar-val .r { color: var(--muted); font-size: 0.72rem; }

    #tooltip {
      position: fixed; pointer-events: none; z-index: 10; display: none;
      background: var(--text-primary); color: var(--page);
      font-size: 0.75rem; padding: 6px 10px; border-radius: 8px; max-width: 240px;
    }

    table { width: 100%; border-collapse: collapse; font-size: 0.82rem; }
    th, td { text-align: left; padding: 7px 8px; border-bottom: 1px solid var(--grid); }
    th { font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); font-weight: 500; }
    td.num { font-variant-numeric: tabular-nums; text-align: right; }
    th.num { text-align: right; }
    td.time { color: var(--muted); font-size: 0.75rem; white-space: nowrap; }
    .attend-yes::before { content: "●"; color: var(--series-1); margin-right: 6px; font-size: 0.7em; vertical-align: 1px; }
    .attend-no { color: var(--muted); }
    .attend-no::before { content: "○"; margin-right: 6px; font-size: 0.7em; vertical-align: 1px; }

    .empty, .error { text-align: center; color: var(--muted); padding: 30px 10px; font-size: 0.9rem; }
    .error { color: #d03b3b; }
    .table-scroll { overflow-x: auto; }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <h1>RSVP Dashboard <small id="subtitle">Nuqman &amp; Alya · Walimatul Urus</small></h1>
      <div class="refresh-row">
        <span id="last-updated"></span>
        <button class="refresh" id="export-btn">Export Excel</button>
        <button class="refresh" id="refresh-btn">Refresh</button>
      </div>
    </header>

    <div class="filters" id="filters"></div>

    <div class="tiles" id="tiles"></div>

    <div class="card">
      <h2>Attending guests by invitation group</h2>
      <p class="subtitle">Total pax from RSVPs marked "attending", per share link</p>
      <div id="group-chart"></div>
    </div>

    <div class="card">
      <h2>All RSVPs</h2>
      <p class="subtitle" id="rsvp-count"></p>
      <div class="table-scroll">
        <table id="rsvp-table" hidden>
          <thead>
            <tr><th>Name</th><th>Group</th><th>Attending</th><th class="num">Pax</th><th>Note</th><th>Phone</th><th>When</th></tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
      <p class="empty" id="table-empty" hidden>No RSVPs yet.</p>
    </div>

    <p class="error" id="error" hidden></p>
  </div>
  <div id="tooltip"></div>

  <script src="js/config.js"></script>
  <script>
    const C = WEDDING_CONFIG;
    const groupLabel = (g) => (g && C.groups[g]) || (g ? g : "Direct link (no group)");

    const fmtTime = (iso) => {
      const d = new Date(iso);
      return isNaN(d) ? "" : d.toLocaleString("en-GB", {
        day: "2-digit", month: "short", hour: "2-digit", minute: "2-digit",
      });
    };

    function tile(label, value, sub) {
      return `<div class="tile"><div class="label">${label}</div><div class="value">${value}</div><div class="sub">${sub || ""}</div></div>`;
    }

    let allRsvps = [];
    let wishesTotal = 0;
    let activeGroup = "all"; // "all", a group key, or "" for direct link

    function buildFilters() {
      const wrap = document.getElementById("filters");
      const hasDirect = allRsvps.some((r) => !(r.group || ""));
      const opts = [["all", "All"]]
        .concat(Object.keys(C.groups).map((g) => [g, groupLabel(g)]))
        .concat(hasDirect ? [["", groupLabel("")]] : []);
      if (!opts.some(([v]) => v === activeGroup)) activeGroup = "all";
      wrap.innerHTML = "";
      opts.forEach(([val, label]) => {
        const b = document.createElement("button");
        b.className = "chip" + (activeGroup === val ? " active" : "");
        b.textContent = label;
        b.addEventListener("click", () => {
          activeGroup = activeGroup === val ? "all" : val;
          renderAll();
        });
        wrap.appendChild(b);
      });
    }

    function renderAll() {
      buildFilters();
      render();
    }

    function render() {
      const rsvps = activeGroup === "all"
        ? allRsvps
        : allRsvps.filter((r) => (r.group || "") === activeGroup);
      const attending = rsvps.filter((r) => r.attending === "Yes");
      const declined = rsvps.filter((r) => r.attending !== "Yes");
      const totalPax = attending.reduce((s, r) => s + r.pax, 0);
      const scope = activeGroup === "all" ? "" : groupLabel(activeGroup);

      document.getElementById("tiles").innerHTML =
        tile("Attending", totalPax + " pax", attending.length + " responses" + (scope ? " · " + scope : "")) +
        tile("Total responses", rsvps.length, scope) +
        tile("Declined", declined.length, "responses" + (scope ? " · " + scope : "")) +
        tile("Wishes", wishesTotal, "ucapan received (all)");

      // --- per-group aggregation (always across all groups) ---
      const keys = Object.keys(C.groups).concat([""]);
      const byGroup = keys.map((g) => {
        const rows = allRsvps.filter((r) => (r.group || "") === g);
        const att = rows.filter((r) => r.attending === "Yes");
        return {
          g,
          label: groupLabel(g),
          pax: att.reduce((s, r) => s + r.pax, 0),
          responses: rows.length,
          declined: rows.length - att.length,
        };
      }).filter((x) => x.g !== "" || x.responses > 0); // hide "direct" row if unused

      byGroup.sort((a, b) => b.pax - a.pax);
      const max = Math.max(1, ...byGroup.map((x) => x.pax));
      const paxTotal = byGroup.reduce((s, x) => s + x.pax, 0);
      const pct = (x) => (paxTotal ? Math.round((x.pax / paxTotal) * 100) : 0);

      const chart = document.getElementById("group-chart");
      chart.innerHTML = "";
      byGroup.forEach((x) => {
        const row = document.createElement("div");
        row.className = "bar-row" + (activeGroup !== "all" && x.g !== activeGroup ? " dim" : "");
        row.innerHTML =
          `<span class="g-label">${x.label}</span>` +
          `<div class="bar-track"><div class="bar" style="width:${(x.pax / max) * 100}%"></div></div>` +
          `<span class="bar-val">${x.pax} pax <span class="r">· ${pct(x)}%</span></span>`;
        row.addEventListener("mousemove", (e) => showTip(e, `${x.label} — ${x.pax} pax attending (${pct(x)}% of total) · ${x.responses} responses · ${x.declined} declined`));
        row.addEventListener("mouseleave", hideTip);
        row.addEventListener("click", () => {
          activeGroup = activeGroup === x.g ? "all" : x.g;
          renderAll();
        });
        chart.appendChild(row);
      });
      if (!byGroup.length) chart.innerHTML = '<p class="empty">No RSVPs yet.</p>';

      // --- table ---
      const table = document.getElementById("rsvp-table");
      const tbody = table.querySelector("tbody");
      tbody.innerHTML = "";
      document.getElementById("table-empty").hidden = rsvps.length > 0;
      table.hidden = rsvps.length === 0;
      document.getElementById("rsvp-count").textContent =
        rsvps.length ? `${rsvps.length} responses${scope ? " · " + scope : ""} · newest first` : (scope ? "No RSVPs for " + scope + " yet." : "");
      rsvps.forEach((r) => {
        const tr = document.createElement("tr");
        const yes = r.attending === "Yes";
        const cells = [
          r.name,
          groupLabel(r.group),
          yes ? "Yes" : "No",
          yes ? r.pax : "—",
          r.note || "—",
          r.phone || "—",
          fmtTime(r.timestamp),
        ];
        cells.forEach((val, i) => {
          const td = document.createElement("td");
          td.textContent = val;
          if (i === 2) td.className = yes ? "attend-yes" : "attend-no";
          if (i === 3) td.className = "num";
          if (i === 6) td.className = "time";
          tr.appendChild(td);
        });
        tbody.appendChild(tr);
      });
    }

    const tip = document.getElementById("tooltip");
    function showTip(e, text) {
      tip.textContent = text;
      tip.style.display = "block";
      const pad = 12;
      let x = e.clientX + pad, y = e.clientY + pad;
      const r = tip.getBoundingClientRect();
      if (x + r.width > innerWidth - 8) x = e.clientX - r.width - pad;
      if (y + r.height > innerHeight - 8) y = e.clientY - r.height - pad;
      tip.style.left = x + "px";
      tip.style.top = y + "px";
    }
    function hideTip() { tip.style.display = "none"; }

    async function load() {
      const err = document.getElementById("error");
      err.hidden = true;
      if (!C.appsScriptUrl) {
        err.hidden = false;
        err.textContent = "No Apps Script URL configured in js/config.js — dashboard has no data source.";
        return;
      }
      try {
        const [rsvpRes, wishRes] = await Promise.all([
          fetch(C.appsScriptUrl + "?type=rsvps").then((r) => r.json()),
          fetch(C.appsScriptUrl + "?type=wishes").then((r) => r.json()),
        ]);
        if (!rsvpRes.rsvps) {
          err.hidden = false;
          err.textContent = "The backend doesn't support ?type=rsvps yet — update Code.gs in Apps Script and deploy a New Version.";
          return;
        }
        allRsvps = rsvpRes.rsvps;
        wishesTotal = (wishRes.wishes || []).length;
        renderAll();
        document.getElementById("last-updated").textContent =
          "Updated " + new Date().toLocaleTimeString("en-GB", { hour: "2-digit", minute: "2-digit", second: "2-digit" });
      } catch (e) {
        err.hidden = false;
        err.textContent = "Could not load data: " + e.message;
      }
    }

    function exportExcel() {
      const rsvps = activeGroup === "all"
        ? allRsvps
        : allRsvps.filter((r) => (r.group || "") === activeGroup);
      const pad = (n) => String(n).padStart(2, "0");
      const fmtFull = (iso) => {
        const d = new Date(iso);
        return isNaN(d) ? "" :
          `${pad(d.getDate())}/${pad(d.getMonth() + 1)}/${d.getFullYear()} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
      };
      const esc = (v) => {
        v = String(v == null ? "" : v);
        return /[",\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v;
      };
      const rows = [["Timestamp", "Name", "Group", "Attending", "Pax", "Phone", "Note"]];
      rsvps.forEach((r) => rows.push([
        fmtFull(r.timestamp), r.name, groupLabel(r.group), r.attending,
        r.attending === "Yes" ? r.pax : 0, r.phone || "", r.note || "",
      ]));
      //  BOM so Excel reads UTF-8 (names with ' and emoji) correctly
      const csv = "\uFEFF" + rows.map((r) => r.map(esc).join(",")).join("\r\n");
      const a = document.createElement("a");
      a.href = URL.createObjectURL(new Blob([csv], { type: "text/csv;charset=utf-8" }));
      const tag = activeGroup === "all" ? "all" : (activeGroup || "direct");
      const today = new Date();
      a.download = `rsvp-${tag}-${today.getFullYear()}${pad(today.getMonth() + 1)}${pad(today.getDate())}.csv`;
      a.click();
      URL.revokeObjectURL(a.href);
    }

    document.getElementById("export-btn").addEventListener("click", exportExcel);
    document.getElementById("refresh-btn").addEventListener("click", load);
    setInterval(load, 60000);
    load();
  </script>
</body>
</html>
